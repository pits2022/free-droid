[project]
name = "freedroid"
version = "0.0.1"
description = "Free-Droid (Szabi) — RPi 5 control software: orchestrator, motion, safety, voice, LLM, tools"
readme = "README.md"
requires-python = ">=3.11"          # Raspberry Pi OS Bookworm ships Python 3.11
license = { text = "GPL-3.0-or-later" }

# Pi-only runtime (no off-Pi mock backend — see CLAUDE.md decision).
dependencies = [
    # Csak a Pi-n telepszik. Az `lgpio` C-kiterjesztést fordít (swig kell hozzá), és
    # feltétel nélküli függőségként MEGBUKTATTA az `uv sync`-et minden nem-Pi gépen —
    # tehát a CLAUDE.md-ben dokumentált `uv sync --extra dev` + `uv run pytest`
    # munkafolyamat off-Pi sosem működött, és helyette PYTHONPATH-kerülőút kellett.
    # A marker aarch64-re szűkít (a spec 64 bites Raspberry Pi OS-t ír elő).
    "lgpio ; platform_machine == 'aarch64'",  # GPIO/PWM: Cytron HAT-MDD10, HC-SR04P
    "adafruit-circuitpython-pca9685",      # PCA9685 servo PWM (I2C) — camera pan/tilt
    "adafruit-circuitpython-neopixel-spi", # WS2812 status ring over SPI (spec: SPI mode → avoids PWM/DMA conflict, so not rpi_ws281x)
    "ollama",                              # cloud/edge LLM client
    "opencv-python-headless",              # camera frames
]

[project.optional-dependencies]
# Az offline hang-stack KÉT extrában, és a szétválasztás MÉRT okból van (2026-08-18):
# az `openwakeword` a Linux-ágon feltétel nélkül `tflite-runtime`-ot húz, aminek
# EGYÁLTALÁN NINCS cp312/cp313 wheelje (a legmagasabb: cp311, minden platformra). A Pi
# Python 3.13-on fut, tehát egyetlen közös `voice` extra mellett a `uv sync` EGÉSZE
# elhasal — és vele a Piper is, ami egyébként hibátlanul telepszik.
#
# Egy extra, ami egy MÁSIK, működő komponenst is megbuktat, rosszabb a hiányzó extránál.
tts = [
    "piper-tts",   # csak onnxruntime + pathvalidate — tiszta 3.13-on
]
wake = [
    # ⚠️ MA NEM TELEPÍTHETŐ a Pi-n (lásd fent). A megoldás nem itt lesz: vagy az
    # openwakeword `--no-deps` + onnx futtatókörnyezet, vagy másik wake-word motor,
    # vagy egy külön 3.11-es venv ennek az egy komponensnek. Külön menet.
    "openwakeword",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
freedroid = "freedroid.orchestrator:main"
freedroid-health = "freedroid.health.cli:main"
# A korpusz-újraépítés a repó saját konvenciója szerint, nem `python -m`-mel: az
# utóbbi RuntimeWarninggal fut (a `freedroid.rag` csomag importálja a `corpus`-t,
# tehát `-m` esetén kétszer töltődik be), és a helyes könyvtárat is fejből kell tudni.
freedroid-corpus = "freedroid.rag.corpus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freedroid"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# A passing xfail is a hard failure: when a Phase-4 behaviour gets implemented,
# its xfail flips to XPASS and forces removing the marker (the test becomes a guard).
xfail_strict = true
markers = [
    "pi_only: requires real Raspberry Pi hardware — skipped elsewhere",
    "phase4: behaviour not implemented yet — xfail until Phase 4 lands",
]
