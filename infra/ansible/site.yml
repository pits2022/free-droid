---
# A szerepkörök CÍMKÉZVE vannak, mert nem mindig mind a három kell. A leggyakoribb eset
# a fejlesztés közben: az edge-en akarunk futtatni, miközben a felhő NEM létezik —
# olyankor a `wireguard_setup` a felhő-peer nélkül írná újra a wg0.conf-ot, ami egy
# később felálló alagút szempontjából csak zaj. Ezért:
#
#   ansible-playbook -i inventory.ini site.yml --limit edge --skip-tags wireguard
- name: Configure free-droid WireGuard VPN
  hosts: all
  become: yes
  roles:
    - role: wireguard_setup
      tags: [wireguard]

- name: Setup Cloud AI Stack
  hosts: cloud
  become: yes
  roles:
    - role: ai_stack
      tags: [ai, cloud]

- name: Setup Edge Node AI and Robotics Stack
  hosts: edge
  become: yes
  roles:
    - role: ai_stack
      tags: [ai, edge]
    - role: edge_robot
      tags: [robot, edge]
