---
- name: Reload systemd
  systemd:
    daemon_reload: true

# `reloaded`, nem `restarted`: az sshd újratöltése NEM bontja a futó munkamenetet,
# tehát a Teremtő nem esik ki abból a kapcsolatból, amin épp hardenel.
- name: Reload sshd
  systemd:
    name: ssh
    state: reloaded

# Ugyanez az elv: a `ct state established` szabály miatt az élő SSH túléli a
# szabálykészlet betöltését.
- name: Reload nftables
  systemd:
    name: nftables
    state: reloaded

# Csak a csoporttagság-változás használja (ld. netdev): a szerep a normál úton
# `state: restarted` taskkal indítja újra az orchestrátort. A `when` ugyanaz a két
# feltétel, különben egy telepítés nélküli gépen a handler elhasalna.
- name: Restart freedroid
  when: robot_project.stat.exists and robot_orchestrator_enabled
  systemd:
    name: freedroid
    state: restarted
