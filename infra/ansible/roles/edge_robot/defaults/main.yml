---
# The unprivileged user that owns and runs the robot software on the Pi
# (matches the inventory's ansible_user for the edge host).
# A boot-config helye. Bookworm/trixie óta /boot/firmware/config.txt; a régebbi
# képeken /boot/config.txt. Változó, mert egy rossz útvonalra írt dtparam CSENDBEN
# hatástalan — a fájl létrejön, a hardver nem kapcsol be.
robot_boot_config: /boot/firmware/config.txt

robot_user: creator
robot_user_home: "/home/{{ robot_user }}"

# Where the repo's robot/ project lives on the Pi. The orchestrator runs from here.
robot_src_dir: /opt/free-droid/robot

# Optional: clone the repo to {{ robot_src_dir | dirname }} if set. Leave empty to
# deliver the code another way (rsync, image bake, manual git).
robot_repo_url: ""
robot_repo_version: main

# A `uv sync` extrái, LISTAKÉNT. A `tts` a Phase 4.2 óta alap: a `piper-tts` hozza a
# `piper` binárist, amit a health-check is keres.
#
# ⚠️ A `wake` SZÁNDÉKOSAN NINCS BENNE: az `openwakeword` `tflite-runtime`-ot húz, aminek
# nincs cp313 wheelje, a Pi pedig Python 3.13-on fut — egyetlen listába téve a TELJES
# `uv sync` elhasalna, és vele a Piper is (mérve 2026-08-18).
#
# A whisper.cpp NEM innen jön: az natív bináris, külön menet.
# A `dev` is rajta van, és ez nem hanyagság: a `uv sync` ELTÁVOLÍTJA, ami nincs a
# listán — `--extra tts` egymagában letörölné a pytestet a Pi-ről. Márpedig a
# hardver-közeli tesztek (`@requires_pi`) CSAK a roboton futtathatók, tehát a
# tesztelhetőség ott üzemi képesség, nem fejlesztői kényelem.
robot_uv_extras:
  - tts
  - dev

# --- Piper TTS hang (a spec 4. szakasza: hu_HU-anonymous-medium) ---
# A modell NEM a pip-csomagban van: két külön fájl (súlyok + konfig), és a `piper`
# a `.onnx` mellett MINDIG a `.onnx.json`-t is olvassa. Ha csak az egyiket töltjük le,
# a hiba a hangnál jelentkezik, nem a letöltésnél.
# ⚠️ A spec korábban `hu_HU-anonymous-medium`-ot írt: az a hang NEM LÉTEZIK (mérve
# 2026-08-18). A magyar kínálat: `anna`, `berta`, `imre` — mind medium, 22050 Hz.
# Az `anna` ideiglenes; a végső választás fül-döntés, és a Teremtőé.
robot_piper_voice: hu_HU-anna-medium

# Az URL a NÉVBŐL származik, nem külön változó: a kettő különtartása azt jelentené, hogy
# a hang cseréjekor az egyiket el lehet felejteni — és akkor a letöltés a RÉGI fájlt
# hozná le az ÚJ néven, amitől a `piper` a beszéd pillanatában hasalna el.
robot_piper_lang_dir: hu/hu_HU
robot_piper_speaker: "{{ robot_piper_voice.split('-')[1] }}"
robot_piper_quality: "{{ robot_piper_voice.split('-')[2] }}"
robot_piper_voice_url: >-
  https://huggingface.co/rhasspy/piper-voices/resolve/main/{{ robot_piper_lang_dir }}/{{
  robot_piper_speaker }}/{{ robot_piper_quality }}
robot_piper_dir: "{{ robot_user_home }}/.local/share/piper-voices"

# Átirat-napló (transcript.py). A DEFAULT_PATH-nak megfelelő útvonal; a robot
# unprivilegizált userként fut, ezért a könyvtárat NEKI kell birtokolnia — enélkül
# a `log()` PermissionError-t kap, amit szándékosan elnyel, és az élő beszéd-teszt
# némán NULLA adatot termel.
robot_transcript_log: /var/log/freedroid/transcript.jsonl
robot_transcript_keep_days: 14   # a napló a Teremtő minden elhangzott mondatát tárolja

# Health-check (freedroid-health) systemd service + timer.
robot_venv_bin: "{{ robot_src_dir }}/.venv/bin"
health_check_on_boot_sec: 60     # first run ~1 min after boot
health_check_interval_sec: 600   # then every 10 min

# ── SSH hardening ────────────────────────────────────────────────────────────
# Kulcs-only belépés, root tiltva. A kulcs ed25519 (az `ssh-rsa`/SHA-1 aláírást az
# OpenSSH 8.8+ eleve tiltja — nem kell "RSA only"-t konfigurálni, az visszaengedne
# egy elavult algoritmust). NEM állítunk fail2ban-t: kulcs-only sshd-n nincs mit
# brute force-olni, viszont a helyszínen ki tudná zárni magát a Teremtő.
robot_harden_sshd: true

# ── Tűzfal (nftables) ────────────────────────────────────────────────────────
# SZÁNDÉKOSAN opt-in: egy rossz forrás-lista a színpad mellett zárja ki a Teremtőt.
# Előbb állítsd be a robot_ssh_allowed_sources-t, aztán kapcsold be. Ugyanaz a
# polaritás-elv, mint a DEBUG-nál: az "elfelejtettem" ne a rossz irányba hibázzon.
robot_firewall_enabled: false

# Ahonnan a 22-es port elérhető. CSAK IPv4 CIDR (az nftables sablon `ip saddr`-t
# rendel belőle) — IPv6-hoz a lenti külön lista van, különben szintaktikai hiba.
# A konferencia-wifi is RFC1918, ezért NE tegyél be általános privát range-et.
robot_ssh_allowed_sources:
  - 10.0.0.0/24            # WireGuard (mother-001 <-> free-droid-001) — a tartalék út
  - 192.168.1.0/24         # itthoni LAN (a tesztelés idejére; a demó előtt kivehető)
  - 192.168.111.0/24       # 4G wifi router (Wifi196) — a helyszíni helyi út
                           # ⚠️ a router IP-je 192.168.111.1 volt, az alhálózat MÉG
                           # ELLENŐRIZENDŐ a helyszínen (nem biztos, hogy /24)

# IPv6-források, külön listán. Alapból üres: minden út IPv4. Ha egyszer IPv6-on
# SSH-znál, ide kell a range — a v4 listába tett IPv6 cím nftables syntax error.
robot_ssh_allowed_sources_v6: []

# ── Tartalék hálózat: saját 4G wifi router ───────────────────────────────────
# Ez a HELYI tartalék út, ha a WireGuard-alagút áll: a Teremtő ugyanarra a
# hálózatra csatlakozik, mint a robot, és LAN-on SSH-zik — se VPN, se CGNAT, se
# éles inventory nem kell hozzá. Kézi, megbízható csatornán beállított hálózat,
# tehát NEM sérti a "soha nem csatlakozik kimondott parancsra" invariánst.
robot_hotspot_ssid: "Wifi196"
robot_hotspot_psk: ""            # SOHA ne kerüljön a repóba: --extra-vars vagy vault
robot_hotspot_priority: 50       # nmcli autoconnect-priority; a magasabb nyer

# ── Hang: melyik ALSA-kártya az alapértelmezett ──────────────────────────────
# MÉRT ok (2026-08-15): `.asoundrc`/`asound.conf` híján az ALSA defaultja a
# card 0, ami a Pi 5-ön a **HDMI**. A robotra nincs monitor dugva, tehát minden
# lejátszás `audio open error: Unknown error 524` (ENOTSUPP) — miközben az USB
# hangszóró ép, csak nem ő a default. A hiba a HANG-stack elhasalásaként jelenik
# meg, pedig csak útválasztás.
#
# NÉV szerint hivatkozunk, NEM kártyaszámmal: az USB-felsorolás sorrendje
# újraindításnál/újradugásnál elcsúszhat, és ez a robot a konferencián kerül
# újra bedugásra. A nevet az `aplay -L` / `arecord -L` adja (CARD=... rész).
robot_alsa_playback_card: "UACDemoV10"   # USB sztereó hangszóró (Jieli 4c4a:4155)
robot_alsa_capture_card: "U20"           # a webkamera beépített mikrofonja
                                         # (Jieli 1224:2a25 "USB PHY 2.0" — egy
                                         # összetett eszköz: UVC videó + audio)

# Hoszt-specifikus beállítás-felülírások, a `freedroid.config.settings` env-formájában
# (`FREEDROID_<SZEKCIÓ>_<MEZŐ>`). Ez a HELYE a gép-specifikus értéknek — NEM a
# verziókövetett settings.py. Egy lokálisan szerkesztett forrás blokkolja a `git pull`-t,
# és a roboton már kétszer okozott csendes sodródást (2026-08-18: a Pi egy régi branchen
# állt, a health-check emiatt a RÉGI modell-tagot igazolta).
#
#   robot_env:
#     FREEDROID_LLM_EDGE_MODEL: "szabi-3b-v12"      # névtér nélküli helyi példány
#     FREEDROID_RAG_TOP_K: "1"                      # gyorsabb edge-válasz
#
# Elgépelésre a betöltő figyelmeztet (stderr -> journald), de nem áll le tőle.
robot_env: {}
