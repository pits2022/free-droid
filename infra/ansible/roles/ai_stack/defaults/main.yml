---
# Az Ollamába húzott modell csomópontonként.
#
# Model decision (concluded on the Hungarian persona benchmark, not generic scores):
# an ASYMMETRIC hybrid — the cloud runs the 8B, the edge runs the 3B. 3B
# Hungarian/persona was the weak link; the 8B lifts it, but at ~4-5 tok/s on CPU it is
# CLOUD-ONLY (the Pi can't run it in real time). Both stay one-line swaps.
#
# TERJESZTÉS: a finomhangolt modellek PUBLIKUS ollama.com modellek (a Teremtő,
# 2026-08-18), tehát `ollama pull` névtelenül húzza őket — SEMMILYEN hitelesítő nem
# kerül sem a Pi-re, sem a felhőre. Ez nem kényelmi döntés: a Pi-n nincs lemeztitkosítás
# (teljes kiolvasást feltételezünk), és egy ollama.com hitelesítő PUSH-jogot is adna,
# azaz egy ellopott robotból meg lehetne mérgezni magát a demó-modellt. A modell amúgy
# is publikus a HF-en, szándékosan — a lopási értéke ~0.
#
# MIÉRT REGISTRY, ÉS NEM GGUF + `ollama create`: az Unsloth GGUF NEM ágyazza be a chat
# sablont (lásd training/Modelfile), tehát csupasz GGUF mellett a Modelfile-t is
# szállítani kellene, és az némán elcsúszhat — a hibája nem kivétel, hanem zagyva
# kimenet a színpadon. A `push`-olt modellbe a TEMPLATE/SYSTEM/paraméterek bele vannak
# égetve, tehát együtt utaznak a súlyokkal.
#
# ⚠️ A névtér (`csaba_ajtony`) az ollama.com FELHASZNÁLÓNÉV, NEM a HuggingFace-é
# (`jabba77`) — a kettő eltér, és a repóban mindkettő szerepel. Ne cseréld őket.
#
# ELLENŐRIZVE 2026-08-18: mindkét manifest lejön a registry.ollama.ai-ról hitelesítő
# fejléc NÉLKÜL (8B 4,92 GB, 3B 2,02 GB), és mindkettőben ott a `template` + `system` +
# `params` réteg a súlyok mellett — vagyis a sablon tényleg együtt utazik a modellel.
cloud_ollama_model: "csaba_ajtony/szabi-8b-v12"   # felhő (DO GPU / CAX) — csak inferencia, 8B
edge_ollama_model: "csaba_ajtony/szabi-3b-v12"    # RPi 5 — offline fallback (Q4_K_M), 3B

# ── whisper.cpp (STT) ─────────────────────────────────────────────────────────────
#
# Natív bináris, NEM pip-csomag: forrásból fordul mindkét csomóponton. Eddig KÉZZEL
# került a Pi-re (2026-08-25), az Ansible nem tudott róla — vagyis egy kártyacsere
# nyomtalanul elvitte volna. Ez a blokk teszi újra előállíthatóvá.

whisper_repo: "https://github.com/ggerganov/whisper.cpp"

# ⚠️ RÖGZÍTETT COMMIT, nem HEAD. Nem óvatoskodás: a whisper.cpp MÁR átnevezte a `main`
# binárist `whisper-cli`-re. Ha HEAD-et követnénk, egy demó előtti újrahúzás
# megismételhetne egy ilyen változást, és a robot MEGNÉMULNA — a hiba pedig futásidőben
# jönne elő. Rögzítve a frissítés tudatos döntés, diffel és újramérve.
whisper_version: "978113305b2ead22249b881deafa131dc8884911"   # 2026-08-25, mérve

whisper_dir: /opt/whisper.cpp
# A modellek helye CSOMÓPONTONKÉNT más, és ez nem ízlés: a felhőn NINCS `creator`
# felhasználó (ott `root` az ansible_user), tehát a `/home/creator` alá írás és az
# `owner: creator` az ELSŐ cloud-os futásnál elhasalt volna. Az edge útvonala
# VÁLTOZATLAN, mert a `VoiceSettings.whisper_model` alapértelmezése rá mutat.
edge_whisper_models_dir: "/home/{{ robot_user | default('creator') }}/.local/share/whisper-models"
cloud_whisper_models_dir: /opt/whisper-models
whisper_model_url: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main"

# A modellek CSOMÓPONTONKÉNT mások, ugyanúgy, mint az Ollamánál — és ugyanazért: az
# edge-en a méret a korlát, a felhőben a GPU.
#
# EDGE: a `small` az a méret, ahol a magyar felismerés használhatóvá válik; a `base` a
# GYORS TARTALÉK (3 s vs 10 s), ha a small valamiért nem indul. Mérve 2026-08-25 a Pi-n.
edge_whisper_models:
  - name: ggml-small-q5_1.bin
    sha256: ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb
  - name: ggml-base-q5_1.bin
    sha256: 422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898

# CLOUD: `large-v3-turbo`, de a KVANTÁLT változat (574 MB), nem a teljes (1,6 GB). Ez
# üzemeltetési döntés, nem minőségi: a felhő ELDOBHATÓ, tehát MINDEN `terraform apply`
# újratölti a modellt — a demó napján a különbség a felállás idejében jelentkezik.
cloud_whisper_models:
  - name: ggml-large-v3-turbo-q5_0.bin
    sha256: 394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2

# A felhőben GPU van, az edge-en nincs. Ez NEM automatikus: a 2026-07-29-i Ollama-mérés
# fő tanulsága épp az volt, hogy egy GPU nélkül fordított/futtatott stack NÉMÁN esik
# vissza CPU-ra — a kártya megvan, a sebesség nincs. Ezért a flag explicit, és a build
# HANGOSAN hasal el, ha a CUDA nem elérhető, ahelyett hogy lassan működne.
cloud_whisper_cmake_flags: ["-DGGML_CUDA=ON"]

# ── whisper-server: a FELHŐS STT végpontja ───────────────────────────────────────
#
# MIÉRT: az STT a hang-lánc leglassabb eleme, és a késleltetése ~ÁLLANDÓ, a hang
# hosszától FÜGGETLENÜL (8,9-15 s a Pi-n a `small`-lal, mérve 2026-08-25) — a Whisper
# minden bemenetet 30 s-os ablakra tölt. GPU-n a `large-v3-turbo` másodperc alatt
# végez, ÉS a tulajdonneveket is jobban viszi.
#
# ⚠️ A PORT KÉT HELYEN ÉL: itt, és a `VoiceSettings.stt_cloud_url`-ben
# (`http://10.0.0.1:8080`). Ha ez változik, ott is át kell írni — a `check_cloud_stt`
# egészség-ellenőrzés az, ami az elcsúszást el fogja kapni.
whisper_server_port: 8080
# A VPN-CÍMRE kötünk, nem 0.0.0.0-ra. A tűzfal ma úgyis csak a 22-t és az 51820-at
# engedi, de a "fail closed" olcsóbb, mint egy jövőbeli tűzfal-lazítás után kiderülő
# nyitott átirat-szolgáltatás. A `vpn_ip` az inventoryból jön.
whisper_server_host: "{{ vpn_ip | default('127.0.0.1') }}"
edge_whisper_cmake_flags: []
