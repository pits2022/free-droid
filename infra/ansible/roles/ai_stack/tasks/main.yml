---
# Ollama mindkét oldalon NATÍVAN települ.
#
# Előzmény: a cloud ág Dockerben futtatta az Ollamát, `--gpus all` NÉLKÜL. Ez a
# CAX31/41 célra HELYES volt (ARM64, CPU-only — a flag 2026-06-24-én szándékosan
# került ki), de GPU-s gépen NÉMÁN elromlik: a konténer a GPU-t nem látja, és a
# drága kártya CPU-sebességgel dolgozik. A 2026-07-29-i DO-mérés (RTX 6000 Ada,
# lásd H200-tests.md) ezt kimérte, és azt is, hogy a DO AI/ML image-en az NVIDIA
# container runtime sincs telepítve (`docker run --gpus all` elhasal).
#
# A natív telepítő magától felismeri a GPU-t ("NVIDIA GPU installed"), és CPU-only
# gépen ugyanúgy működik. Egy út mindkét esetre — ezért tűnt el a Docker ág és vele
# az nvidia-container-toolkit igénye is. A mérés natív Ollamával futott: 8B = 144 tok/s.

- name: Install prerequisites
  apt:
    name:
      - curl
    state: present
    update_cache: yes

# A két csomópont csak a kötési címben és a modellben tér el; minden más közös.
# cloud: a wg0 IP-jén hallgat (VPN-only), edge: loopback (csak a helyi orchestrátoré).
- name: Resolve node-specific Ollama settings
  set_fact:
    ollama_is_cloud: "{{ 'cloud' in group_names }}"
    ollama_bind: "{{ (vpn_ip ~ ':11434') if 'cloud' in group_names else '127.0.0.1:11434' }}"
    ollama_model: "{{ cloud_ollama_model if 'cloud' in group_names else edge_ollama_model }}"

- name: Install Ollama natively (detects an NVIDIA GPU on its own; CPU-only is fine)
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama

- name: Ensure the Ollama systemd drop-in directory exists
  file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'

# A kötés drop-inból jön, nem a unit szerkesztéséből: az Ollama frissítése felülírja
# a unitot, a drop-int nem.
#
# A cloud oldal a wg0 címére köt, ami csak akkor létezik, ha a WireGuard már fent van
# — ezért az After=. A Restart=always fedezi azt az esetet, ha az Ollama boot közben
# mégis a wg0 elé érne: a bind elhasal, majd újrapróbálja.
- name: Pin the Ollama bind address (and order it after WireGuard on the cloud node)
  copy:
    dest: /etc/systemd/system/ollama.service.d/10-freedroid.conf
    mode: '0644'
    content: |
      [Unit]
      {% if ollama_is_cloud %}
      After=wg-quick@wg0.service
      Wants=wg-quick@wg0.service
      {% endif %}

      [Service]
      Environment="OLLAMA_HOST={{ ollama_bind }}"
      Restart=always
      RestartSec=5
  notify:
    - Reload systemd
    - Restart Ollama

# A modellhúzás előtt a szolgáltatásnak már a VÉGLEGES címen kell futnia, különben a
# pull a régi kötésen menne, és a lenti ellenőrzés hamis képet adna.
- name: Apply pending systemd changes before talking to Ollama
  meta: flush_handlers

- name: Ensure Ollama is enabled and running
  systemd:
    name: ollama
    enabled: yes
    state: started

- name: Pull base model into Ollama
  command: ollama pull {{ ollama_model }}
  environment:
    OLLAMA_HOST: "{{ ollama_bind }}"
  register: ollama_pull
  until: ollama_pull.rc == 0
  retries: 5
  delay: 10
  changed_when: true

# Ellenőrzés, nem díszítés: a néma hibamód itt az, hogy a szolgáltatás fut, de nem a
# szánt címen hallgat (pl. a drop-in nem érvényesült). Ez a Pi-n derülne ki először,
# amikor már nem éri el a felhőt.
# `check_mode: false`: CSAK OLVAS, tehát száraz futásban is le KELL futnia. Enélkül a
# `--check` átugorja, a `register` egy "skipped" dictet ad, és a lenti assert azon
# hasal el — vagyis a száraz futás pont ott áll meg, ahol a leghasznosabb lenne
# (mérve 2026-08-18: "object of type 'dict' has no attribute 'content'").
- name: Verify Ollama answers on the intended address
  uri:
    url: "http://{{ ollama_bind }}/api/tags"
    return_content: yes
  register: ollama_tags
  check_mode: false
  until: ollama_tags.status == 200
  retries: 6
  delay: 5

# SZÁRAZ futásban kimarad, és ez nem lustaság: a modellt lehúzó `command` check
# módban nem fut le, tehát egy friss gépen ez az assert olyasmit kérne számon, amit a
# száraz futás szándékosan nem csinált meg. Az eredmény "hiba" lenne egy tökéletesen
# rendben lévő tervre.
- name: Verify the pulled model is actually loaded
  when: not ansible_check_mode
  assert:
    that: ollama_model.split(':')[0] in ollama_tags.content
    fail_msg: >-
      Az Ollama válaszol a(z) {{ ollama_bind }} címen, de a(z) {{ ollama_model }}
      modell nincs a listában — a pull elhasalt, vagy másik példányhoz ment.
    success_msg: "Ollama OK a(z) {{ ollama_bind }} címen, {{ ollama_model }} betöltve."

# A felhő inferencia-végpontnak SOHA nem szabad a publikus interfészen lógnia.
# Ez a 2026-07-29-i mérésen validált invariáns (H200-tests.md, 4. szakasz).
- name: Assert the cloud API is not exposed on the public interface
  when: ollama_is_cloud
  block:
    # Szintén csak olvas, és szintén kell száraz futásban: ez egy BIZTONSÁGI őr, ami a
    # PILLANATNYI állapotot nézi (wildcard kötés), nem egy tervezett változást. Ha a
    # `--check` átugorja, az őr némán kimarad pont abból a futásból, amivel ellenőrizni
    # akartuk. Ugyanaz a hibaosztály, mint fent.
    - name: Read the listening sockets
      command: ss -lntH
      register: ollama_sockets
      changed_when: false
      check_mode: false

    # A minta három wildcard-alakot fog meg, mert az `ss` mindhármat írhatja:
    #   0.0.0.0  — IPv4 wildcard
    #   [::]     — IPv6 wildcard (egyes kimenetekben)
    #   *        — IPv6 wildcard, ahogy az iproute2 6.15 ténylegesen írja (MÉRVE)
    # A `*` alak a PR #32 review találata volt; nélküle az őr némán átengedte volna.
    # A két oldali horgony (^|\s) ... (\s|$) kell, különben a `0.0.0.0` részstringként
    # illeszkedne egy legitim címre is (pl. 100.0.0.0) -> téves riasztás.
    # A mintát a test_bind_guard.py próbálja ki 8 esettel — ha ITT változik, OTT is.
    - name: Fail if Ollama listens on a wildcard address
      assert:
        that: >-
          ollama_sockets.stdout_lines
          | select('search', '(^|\\s)(\\*|0\\.0\\.0\\.0|\\[::\\]):11434(\\s|$)')
          | list | length == 0
        fail_msg: >-
          Az Ollama wildcard címen (0.0.0.0 vagy [::]) hallgat a 11434-en — a felhő
          inferencia-végpont így a publikus NIC-en is elérhető. VPN-only kötés kell.
        success_msg: "Az Ollama csak a VPN-címen ({{ ollama_bind }}) hallgat."

# ── whisper.cpp (STT) ─────────────────────────────────────────────────────────────
#
# Ugyanaz a szerkezet, mint az Ollamánál: csomópont-függő értékek egy `set_fact`-be,
# utána közös taszkok. A `stt` címkével kihagyható (a fordítás a Pi-n ~2 perc, négy
# magon — akkun futó roboton ez nem mindegy).

- name: Resolve node-specific whisper settings
  set_fact:
    whisper_models: "{{ cloud_whisper_models if 'cloud' in group_names else edge_whisper_models }}"
    whisper_cmake_flags: "{{ cloud_whisper_cmake_flags if 'cloud' in group_names else edge_whisper_cmake_flags }}"
  tags: [stt]

- name: Install whisper.cpp build prerequisites
  apt:
    name:
      - cmake
      - g++
      - git
    state: present
    update_cache: yes
  tags: [stt]

- name: Check out whisper.cpp at the PINNED commit
  git:
    repo: "{{ whisper_repo }}"
    dest: "{{ whisper_dir }}"
    version: "{{ whisper_version }}"
    depth: 1
  register: whisper_checkout
  tags: [stt]

# STATIKUSAN (`BUILD_SHARED_LIBS=OFF`). MÉRVE 2026-08-25: a megosztott build binárisa
# NÉGY .so-t húz, ABSZOLÚT útvonallal a build-könyvtárba (libwhisper, libggml,
# libggml-base, libggml-cpu). Egy sima másolat a PATH-ra ilyenkor csak VÉLETLENÜL
# működik — amíg a build-fa megvan; aki kitakarítja, az a robotot némítja el, és a hiba
# FUTÁSIDŐBEN jön elő. Statikusan egyetlen, önhordó fájl marad.
# Verzió-váltáskor a build-fa MEGY: a `creates:` őrök különben egy régi binárist
# tartanának életben az új forrás mellett — és a "melyik kód fut valójában" kérdés
# ebben a projektben már egyszer napokat vitt el (a Pi hetekig régi branchen állt).
- name: Drop the whisper build tree when the pinned version changed
  file:
    path: "{{ whisper_dir }}/build"
    state: absent
  when: whisper_checkout.changed
  tags: [stt]

- name: Configure whisper.cpp (static, single self-contained binary)
  command: >-
    cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
    -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
    {{ whisper_cmake_flags | join(' ') }}
  args:
    chdir: "{{ whisper_dir }}"
    creates: "{{ whisper_dir }}/build/CMakeCache.txt"
  tags: [stt]

- name: Compile whisper.cpp
  command: "cmake --build build -j {{ ansible_processor_vcpus | default(2) }}"
  args:
    chdir: "{{ whisper_dir }}"
    creates: "{{ whisper_dir }}/build/bin/whisper-cli"
  tags: [stt]

# A PATH-ra kerül, és ez nem kényelmi döntés: a `freedroid.health.check_voice_binaries`
# és a TÉNYLEGES hívás UGYANAZT a keresést használja (`find_voice_binary`: venv, majd
# PATH). Ha a bináris a build-könyvtárban maradna, a health-check "hiányzik"-ot mondana
# egy működő roboton — vagy fordítva, és a kettő csendben elcsúszna.
- name: Install whisper-cli onto the PATH
  copy:
    src: "{{ whisper_dir }}/build/bin/whisper-cli"
    dest: /usr/local/bin/whisper-cli
    remote_src: yes
    mode: "0755"
  tags: [stt]

- name: Ensure the whisper model directory exists
  file:
    path: "{{ whisper_models_dir }}"
    state: directory
    owner: "{{ robot_user | default('creator') }}"
    group: "{{ robot_user | default('creator') }}"
    mode: "0755"
  register: whisper_dir_allapot
  tags: [stt]

# CHECKSUMMAL. Egy félbeszakadt 190 MB-os letöltés LÉTEZŐ fájlt hagy maga után: a
# jelenlét-ellenőrzés átmegy, és a hiba az ELSŐ ÁTIRATNÁL jön elő — vagyis a színpadon.
# A `get_url` a rossz összegű fájlt eldobja és újratölti.
#
# A `when` ugyanaz a száraz-futás-védelem, mint a Piper hangnál: check módban a fenti
# `file:` csak SZIMULÁLJA a könyvtárat, a `get_url` viszont ellenőrizné — egy friss
# gépen a száraz futás elhasalna, pedig az éles rendben lefutna.
- name: Download the whisper models ({{ whisper_models | map(attribute='name') | join(', ') }})
  when: not (ansible_check_mode and (whisper_dir_allapot.changed | default(false)))
  get_url:
    url: "{{ whisper_model_url }}/{{ item.name }}"
    dest: "{{ whisper_models_dir }}/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: "{{ robot_user | default('creator') }}"
    group: "{{ robot_user | default('creator') }}"
    mode: "0644"
  loop: "{{ whisper_models }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [stt]
