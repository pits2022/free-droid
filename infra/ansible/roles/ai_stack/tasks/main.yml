---
# Ollama mindkét oldalon NATÍVAN települ.
#
# Előzmény: a cloud ág Dockerben futtatta az Ollamát, `--gpus all` NÉLKÜL. Ez a
# CAX31/41 célra HELYES volt (ARM64, CPU-only — a flag 2026-06-24-én szándékosan
# került ki), de GPU-s gépen NÉMÁN elromlik: a konténer a GPU-t nem látja, és a
# drága kártya CPU-sebességgel dolgozik. A 2026-07-29-i DO-mérés (RTX 6000 Ada,
# lásd H200-tests.md) ezt kimérte, és azt is, hogy a DO AI/ML image-en az NVIDIA
# container runtime sincs telepítve (`docker run --gpus all` elhasal).
#
# A natív telepítő magától felismeri a GPU-t ("NVIDIA GPU installed"), és CPU-only
# gépen ugyanúgy működik. Egy út mindkét esetre — ezért tűnt el a Docker ág és vele
# az nvidia-container-toolkit igénye is. A mérés natív Ollamával futott: 8B = 144 tok/s.

- name: Install prerequisites
  apt:
    name:
      - curl
    state: present
    update_cache: yes

# A két csomópont csak a kötési címben és a modellben tér el; minden más közös.
# cloud: a wg0 IP-jén hallgat (VPN-only), edge: loopback (csak a helyi orchestrátoré).
- name: Resolve node-specific Ollama settings
  set_fact:
    ollama_is_cloud: "{{ 'cloud' in group_names }}"
    ollama_bind: "{{ (vpn_ip ~ ':11434') if 'cloud' in group_names else '127.0.0.1:11434' }}"
    ollama_model: "{{ cloud_ollama_model if 'cloud' in group_names else edge_ollama_model }}"

- name: Install Ollama natively (detects an NVIDIA GPU on its own; CPU-only is fine)
  shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: /usr/local/bin/ollama

- name: Ensure the Ollama systemd drop-in directory exists
  file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'

# A kötés drop-inból jön, nem a unit szerkesztéséből: az Ollama frissítése felülírja
# a unitot, a drop-int nem.
#
# A cloud oldal a wg0 címére köt, ami csak akkor létezik, ha a WireGuard már fent van
# — ezért az After=. A Restart=always fedezi azt az esetet, ha az Ollama boot közben
# mégis a wg0 elé érne: a bind elhasal, majd újrapróbálja.
- name: Pin the Ollama bind address (and order it after WireGuard on the cloud node)
  copy:
    dest: /etc/systemd/system/ollama.service.d/10-freedroid.conf
    mode: '0644'
    content: |
      [Unit]
      {% if ollama_is_cloud %}
      After=wg-quick@wg0.service
      Wants=wg-quick@wg0.service
      {% endif %}

      [Service]
      Environment="OLLAMA_HOST={{ ollama_bind }}"
      Restart=always
      RestartSec=5
  notify:
    - Reload systemd
    - Restart Ollama

# A modellhúzás előtt a szolgáltatásnak már a VÉGLEGES címen kell futnia, különben a
# pull a régi kötésen menne, és a lenti ellenőrzés hamis képet adna.
- name: Apply pending systemd changes before talking to Ollama
  meta: flush_handlers

- name: Ensure Ollama is enabled and running
  systemd:
    name: ollama
    enabled: yes
    state: started

- name: Pull base model into Ollama
  command: ollama pull {{ ollama_model }}
  environment:
    OLLAMA_HOST: "{{ ollama_bind }}"
  register: ollama_pull
  until: ollama_pull.rc == 0
  retries: 5
  delay: 10
  changed_when: true

# Ellenőrzés, nem díszítés: a néma hibamód itt az, hogy a szolgáltatás fut, de nem a
# szánt címen hallgat (pl. a drop-in nem érvényesült). Ez a Pi-n derülne ki először,
# amikor már nem éri el a felhőt.
# `check_mode: false`: CSAK OLVAS, tehát száraz futásban is le KELL futnia. Enélkül a
# `--check` átugorja, a `register` egy "skipped" dictet ad, és a lenti assert azon
# hasal el — vagyis a száraz futás pont ott áll meg, ahol a leghasznosabb lenne
# (mérve 2026-08-18: "object of type 'dict' has no attribute 'content'").
- name: Verify Ollama answers on the intended address
  uri:
    url: "http://{{ ollama_bind }}/api/tags"
    return_content: yes
  register: ollama_tags
  check_mode: false
  until: ollama_tags.status == 200
  retries: 6
  delay: 5

# SZÁRAZ futásban kimarad, és ez nem lustaság: a modellt lehúzó `command` check
# módban nem fut le, tehát egy friss gépen ez az assert olyasmit kérne számon, amit a
# száraz futás szándékosan nem csinált meg. Az eredmény "hiba" lenne egy tökéletesen
# rendben lévő tervre.
- name: Verify the pulled model is actually loaded
  when: not ansible_check_mode
  assert:
    that: ollama_model.split(':')[0] in ollama_tags.content
    fail_msg: >-
      Az Ollama válaszol a(z) {{ ollama_bind }} címen, de a(z) {{ ollama_model }}
      modell nincs a listában — a pull elhasalt, vagy másik példányhoz ment.
    success_msg: "Ollama OK a(z) {{ ollama_bind }} címen, {{ ollama_model }} betöltve."

# A felhő inferencia-végpontnak SOHA nem szabad a publikus interfészen lógnia.
# Ez a 2026-07-29-i mérésen validált invariáns (H200-tests.md, 4. szakasz).
- name: Assert the cloud API is not exposed on the public interface
  when: ollama_is_cloud
  block:
    # Szintén csak olvas, és szintén kell száraz futásban: ez egy BIZTONSÁGI őr, ami a
    # PILLANATNYI állapotot nézi (wildcard kötés), nem egy tervezett változást. Ha a
    # `--check` átugorja, az őr némán kimarad pont abból a futásból, amivel ellenőrizni
    # akartuk. Ugyanaz a hibaosztály, mint fent.
    - name: Read the listening sockets
      command: ss -lntH
      register: ollama_sockets
      changed_when: false
      check_mode: false

    # A minta három wildcard-alakot fog meg, mert az `ss` mindhármat írhatja:
    #   0.0.0.0  — IPv4 wildcard
    #   [::]     — IPv6 wildcard (egyes kimenetekben)
    #   *        — IPv6 wildcard, ahogy az iproute2 6.15 ténylegesen írja (MÉRVE)
    # A `*` alak a PR #32 review találata volt; nélküle az őr némán átengedte volna.
    # A két oldali horgony (^|\s) ... (\s|$) kell, különben a `0.0.0.0` részstringként
    # illeszkedne egy legitim címre is (pl. 100.0.0.0) -> téves riasztás.
    # A mintát a test_bind_guard.py próbálja ki 8 esettel — ha ITT változik, OTT is.
    - name: Fail if Ollama listens on a wildcard address
      assert:
        that: >-
          ollama_sockets.stdout_lines
          | select('search', '(^|\\s)(\\*|0\\.0\\.0\\.0|\\[::\\]):11434(\\s|$)')
          | list | length == 0
        fail_msg: >-
          Az Ollama wildcard címen (0.0.0.0 vagy [::]) hallgat a 11434-en — a felhő
          inferencia-végpont így a publikus NIC-en is elérhető. VPN-only kötés kell.
        success_msg: "Az Ollama csak a VPN-címen ({{ ollama_bind }}) hallgat."

# ── whisper.cpp (STT) ─────────────────────────────────────────────────────────────
#
# Ugyanaz a szerkezet, mint az Ollamánál: csomópont-függő értékek egy `set_fact`-be,
# utána közös taszkok. A `stt` címkével kihagyható (a fordítás a Pi-n ~2 perc, négy
# magon — akkun futó roboton ez nem mindegy).

# A GPU compute capability-jét MEGMÉRJÜK, nem beégetjük: a DO GPU-kínálata bizonyítottan
# változik (2026-08-28-ra az Ada eltűnt, H100 lépett a helyére), és a ggml alap arch-listája
# nem ad valódi SASS-t minden architektúrához — a hiányzó cubin PTX-JIT-re kényszerít, ami
# ezen az image-en (nvcc 13.1 > driver CUDA 13.0) `abort()`-ot ad az ELSŐ kérésre.
# Részletek és a mért bizonyíték: `defaults/main.yml`, `whisper_cuda_arch`.
- name: Measure the cloud GPU's CUDA compute capability
  when: "'cloud' in group_names and whisper_cuda_arch == ''"
  command: nvidia-smi --query-gpu=compute_cap --format=csv,noheader
  register: gpu_compute_cap
  changed_when: false
  check_mode: false
  tags: [stt]

# `stdout_lines[0]`: több GPU-nál is EGY architektúrára fordítunk (a szerver úgyis a
# 0-s eszközt használja). A pont kiesik: "9.0" -> "90", ez a cmake alakja.
- name: Resolve the CUDA architecture to build for
  when: "'cloud' in group_names"
  set_fact:
    whisper_arch: >-
      {{ whisper_cuda_arch if whisper_cuda_arch != ''
         else (gpu_compute_cap.stdout_lines[0] | trim | replace('.', '')) }}
  tags: [stt]

- name: Resolve node-specific whisper settings
  set_fact:
    whisper_models: "{{ cloud_whisper_models if 'cloud' in group_names else edge_whisper_models }}"
    whisper_cmake_flags: >-
      {{ (cloud_whisper_cmake_flags + ['-DCMAKE_CUDA_ARCHITECTURES=' ~ whisper_arch])
         if 'cloud' in group_names else edge_whisper_cmake_flags }}
    whisper_models_dir: "{{ cloud_whisper_models_dir if 'cloud' in group_names else edge_whisper_models_dir }}"
    # A felhőn `root` a gazda (nincs `creator` felhasználó), az edge-en a robot_user.
    whisper_owner: "{{ 'root' if 'cloud' in group_names else (robot_user | default('creator')) }}"
  tags: [stt]

- name: Install whisper.cpp build prerequisites
  apt:
    name:
      - cmake
      - g++
      - git
    state: present
    update_cache: yes
  tags: [stt]

# `depth` NINCS, és ez SZÁNDÉKOS: egy RÖGZÍTETT COMMIT-ra sekély klón nem kérhető
# ("Shallow clones are only available for HEAD, branches, tags or in combination with
# refspec" — a `depth: 1` némán figyelmen kívül maradt, mérve 2026-08-26). A paraméter
# tehát olyasmit ígért, amit nem teljesített. A refspec-es kerülőút SHA-ra a szerver
# beállításán múlik (`allowReachableSHA1InWant`), azaz egy demó előtti újrahúzáskor
# bukhatna — 114 MB és ~20 s a teljes klón, ez olcsóbb, mint a kockázat.
- name: Check out whisper.cpp at the PINNED commit
  git:
    repo: "{{ whisper_repo }}"
    dest: "{{ whisper_dir }}"
    version: "{{ whisper_version }}"
  register: whisper_checkout
  tags: [stt]

# STATIKUSAN (`BUILD_SHARED_LIBS=OFF`). MÉRVE 2026-08-25: a megosztott build binárisa
# NÉGY .so-t húz, ABSZOLÚT útvonallal a build-könyvtárba (libwhisper, libggml,
# libggml-base, libggml-cpu). Egy sima másolat a PATH-ra ilyenkor csak VÉLETLENÜL
# működik — amíg a build-fa megvan; aki kitakarítja, az a robotot némítja el, és a hiba
# FUTÁSIDŐBEN jön elő. Statikusan egyetlen, önhordó fájl marad.
# Verzió-váltáskor a build-fa MEGY: a `creates:` őrök különben egy régi binárist
# tartanának életben az új forrás mellett — és a "melyik kód fut valójában" kérdés
# ebben a projektben már egyszer napokat vitt el (a Pi hetekig régi branchen állt).
# A build-fa NEM csak a verzió, hanem a CMAKE-FLAGEK változására is megy. Enélkül a
# lenti `creates: build/CMakeCache.txt` átugorja a configure-t, és a fordítás némán a
# RÉGI cache-sel (régi architektúrával) menne tovább — vagyis pont az a javítás nem
# érvényesülne, amiért a flag bekerült. A lenyomat a fordítás UTÁN íródik, hogy egy
# félbeszakadt build ne látszódjon késznek.
- name: Read the cmake flags the existing build tree was configured with
  slurp:
    src: "{{ whisper_dir }}/.freedroid-cmake-flags"
  register: whisper_regi_flagek
  failed_when: false
  changed_when: false
  check_mode: false
  tags: [stt]

- name: Drop the whisper build tree when the pinned version OR the cmake flags changed
  file:
    path: "{{ whisper_dir }}/build"
    state: absent
  when: >-
    whisper_checkout.changed
    or (whisper_regi_flagek.content | default('') | b64decode | trim)
       != (whisper_cmake_flags | join(' '))
  tags: [stt]

- name: Configure whisper.cpp (static, single self-contained binary)
  command: >-
    cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
    -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
    {{ whisper_cmake_flags | join(' ') }}
  args:
    chdir: "{{ whisper_dir }}"
    creates: "{{ whisper_dir }}/build/CMakeCache.txt"
  tags: [stt]

# `ansible_facts.processor_vcpus`, NEM `ansible_processor_vcpus`: az utóbbi az
# INJECT_FACTS_AS_VARS-ból jön, ami deprecated és az ansible-core 2.24-ben megszűnik.
# A hiba akkor NÉMA lenne: a változó eltűnik, a `default(2)` beugrik, és a fordítás
# négy mag helyett kettőn menne — kétszer lassabban, hibaüzenet nélkül, egy akkun
# futó roboton. (Mérve 2026-08-26: mindkét alak 4-et ad ma.)
- name: Compile whisper.cpp
  command: "cmake --build build -j {{ ansible_facts.processor_vcpus | default(2) }}"
  args:
    chdir: "{{ whisper_dir }}"
    creates: "{{ whisper_dir }}/build/bin/whisper-cli"
  tags: [stt]

# A PATH-ra kerül, és ez nem kényelmi döntés: a `freedroid.health.check_voice_binaries`
# és a TÉNYLEGES hívás UGYANAZT a keresést használja (`find_voice_binary`: venv, majd
# PATH). Ha a bináris a build-könyvtárban maradna, a health-check "hiányzik"-ot mondana
# egy működő roboton — vagy fordítva, és a kettő csendben elcsúszna.
- name: Record the cmake flags this build tree was configured with
  copy:
    dest: "{{ whisper_dir }}/.freedroid-cmake-flags"
    content: "{{ whisper_cmake_flags | join(' ') }}\n"
    mode: "0644"
  tags: [stt]

- name: Install whisper-cli onto the PATH
  copy:
    src: "{{ whisper_dir }}/build/bin/whisper-cli"
    dest: /usr/local/bin/whisper-cli
    remote_src: yes
    mode: "0755"
  tags: [stt]

- name: Ensure the whisper model directory exists
  file:
    path: "{{ whisper_models_dir }}"
    state: directory
    owner: "{{ whisper_owner }}"
    group: "{{ whisper_owner }}"
    mode: "0755"
  register: whisper_dir_allapot
  tags: [stt]

# CHECKSUMMAL. Egy félbeszakadt 190 MB-os letöltés LÉTEZŐ fájlt hagy maga után: a
# jelenlét-ellenőrzés átmegy, és a hiba az ELSŐ ÁTIRATNÁL jön elő — vagyis a színpadon.
# A `get_url` a rossz összegű fájlt eldobja és újratölti.
#
# A `when` ugyanaz a száraz-futás-védelem, mint a Piper hangnál: check módban a fenti
# `file:` csak SZIMULÁLJA a könyvtárat, a `get_url` viszont ellenőrizné — egy friss
# gépen a száraz futás elhasalna, pedig az éles rendben lefutna.
- name: Download the whisper models ({{ whisper_models | map(attribute='name') | join(', ') }})
  when: not (ansible_check_mode and (whisper_dir_allapot.changed | default(false)))
  get_url:
    url: "{{ whisper_model_url }}/{{ item.name }}"
    dest: "{{ whisper_models_dir }}/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: "{{ whisper_owner }}"
    group: "{{ whisper_owner }}"
    mode: "0644"
  loop: "{{ whisper_models }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [stt]

# ── whisper-server: a FELHŐS STT végpontja (CSAK a felhőn) ───────────────────────
#
# Az edge-en NINCS szerver: ott a `whisper-cli` fut hívásonként. A felhőn azért kell
# szolgáltatás, mert a modellt EGYSZER kell GPU-ra tölteni — hívásonkénti indítással
# a betöltés (több tíz másodperc) minden mondatra rájönne, azaz pont a nyereséget enné.

- name: Install whisper-server onto the PATH (cloud only)
  when: "'cloud' in group_names"
  copy:
    src: "{{ whisper_dir }}/build/bin/whisper-server"
    dest: /usr/local/bin/whisper-server
    remote_src: yes
    mode: "0755"
  tags: [stt]

- name: Install the whisper-server unit (cloud only)
  when: "'cloud' in group_names"
  template:
    src: whisper-server.service.j2
    dest: /etc/systemd/system/whisper-server.service
    mode: "0644"
  notify: Reload systemd
  register: whisper_unit
  tags: [stt]

- name: Enable and start whisper-server (cloud only)
  when: "'cloud' in group_names"
  systemd:
    name: whisper-server
    enabled: yes
    state: "{{ 'restarted' if whisper_unit.changed else 'started' }}"
    daemon_reload: yes
  tags: [stt]

# 🔴 FÜSTPRÓBA — VALÓDI ÁTIRAT, nem életjel. Ez a taszk a 2026-08-28-i hibából született:
# a whisper-server ELINDULT, a modell a VRAM-ba töltődött, a `ss` őr és a `check_cloud_stt`
# health-check (GET-próba) egyaránt ZÖLD volt — és az első valódi POST `abort()`-tal ölte
# meg a szolgáltatást (PTX/toolchain, lásd `whisper_cuda_arch`). Vagyis a teljes zöld
# telepítés egy olyan felhőt adott, ami a színpadon némult volna el.
#
# A próba a repó SAJÁT mintáján megy (`samples/jfk.wav`, a klónnal érkezik), tehát nem
# kell se hangfelvétel, se hálózat. Angol, és ez itt mindegy: a kérdés nem a magyar
# pontosság, hanem hogy a CUDA-út VÉGIGFUT-e egyáltalán.
#
# A `retries` a szerver INDULÁSÁRA vár (a modell GPU-ra töltése pár másodperc), nem a hibát
# maszkolja: egy törött CUDA minden próbán ugyanúgy elhasal, tehát a taszk hangosan bukik.
- name: Smoke-test the cloud STT with a REAL transcription (cloud only)
  when: "'cloud' in group_names and not ansible_check_mode"
  command: >-
    curl -sf --max-time 120
    -F file=@{{ whisper_dir }}/samples/jfk.wav
    -F response_format=json
    http://{{ whisper_server_host }}:{{ whisper_server_port }}/inference
  register: whisper_smoke
  changed_when: false
  retries: 6
  delay: 5
  # Szándékosan SZÖVEGES illesztés, nem `from_json`: halott szervernél a stdout ÜRES, és a
  # `from_json` ott a FELTÉTEL kiértékelése közben dobna kivételt — az `until` ilyenkor nem
  # újrapróbál, hanem érthetetlen sablonhibával áll meg, épp elrejtve a valódi okot.
  # A tartalmi ellenőrzés a következő taszké, amikor már tudjuk, hogy JSON jött.
  until: whisper_smoke.rc == 0 and '"text"' in whisper_smoke.stdout
  tags: [stt]

- name: Assert the cloud STT returned a non-empty transcript
  when: "'cloud' in group_names and not ansible_check_mode"
  assert:
    that: (whisper_smoke.stdout | from_json).text | trim != ''
    fail_msg: >-
      A whisper-server válaszolt, de ÜRES átiratot adott a samples/jfk.wav-ra — a CUDA-út
      vagy a modell hibás. A szolgáltatás életjele tehát NEM elég bizonyíték.
    success_msg: >-
      A felhős STT ÉL és valódi átiratot ad:
      {{ (whisper_smoke.stdout | from_json).text | trim | truncate(80) }}
  tags: [stt]

# UGYANAZ AZ INVARIÁNS, mint az Ollamánál, és ugyanazért: egy átirat-szolgáltatás a
# publikus NIC-en ingyenes STT mindenkinek, és a hibája NÉMA. A minta a `whisper-cli`
# portjára szól; a szerkezete szándékosan azonos a fenti Ollama-őrrel (a `*` alakot az
# iproute2 6.15 tényleg írja — PR #32 találata).
- name: Assert the cloud STT is not exposed on the public interface
  when: "'cloud' in group_names"
  block:
    - name: Read the listening sockets (STT)
      command: ss -lntH
      register: whisper_sockets
      changed_when: false
      check_mode: false

    - name: Fail if whisper-server listens on a wildcard address
      assert:
        that: >-
          whisper_sockets.stdout_lines
          | select('search', '(^|\\s)(\\*|0\\.0\\.0\\.0|\\[::\\]):' ~ whisper_server_port ~ '(\\s|$)')
          | list | length == 0
        fail_msg: >-
          A whisper-server wildcard címen hallgat a(z) {{ whisper_server_port }}-on — az
          átirat-szolgáltatás így a publikus NIC-en is elérhető. VPN-only kötés kell.
        success_msg: "A whisper-server csak a VPN-címen ({{ whisper_server_host }}) hallgat."
  tags: [stt]
