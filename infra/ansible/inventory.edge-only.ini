# EDGE-ONLY inventory — a `terraform destroy` UTÁNI állapotra.
#
# Miért van ez a fájl: az `inventory.ini`-t a Terraform generálja (`local_file`), tehát a
# `destroy` VELE EGYÜTT viszi el — pedig a Pi nem is terraform-kezelt, és felhő nélkül is
# dolgozunk rajta. Kétszer kellett kézzel újraírni (2026-08-26 és 08-28), ezért inkább
# verziókövetett:
#
#     cp inventory.edge-only.ini inventory.ini
#
# A következő `terraform apply` FELÜLÍRJA az inventory.ini-t (a [cloud] csoporttal
# együtt) — ez így helyes, ez a fájl csak a felhő nélküli időszakra van.
#
# A [cloud] csoport SZÁNDÉKOSAN hiányzik: felhő nélkül egy odaírt IP csak félrevezetne,
# a `wireguard_setup` a nem létező peerhez írná újra a wg0.conf-ot.

[edge]
free-droid-001 ansible_host=free-droid-001.home ansible_user=creator ansible_ssh_private_key_file=~/.ssh/free-droid ansible_ssh_common_args='-o IdentitiesOnly=yes' vpn_ip=10.0.0.2
